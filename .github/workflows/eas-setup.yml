name: Set up over-the-air updates

on: workflow_dispatch

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eas-cli@latest whoami
      - run: npx eas-cli@latest init --non-interactive --force
      - run: npx eas-cli@latest update:configure --platform ios --non-interactive || true
      - name: Make sure the update URL is set
        run: |
          node -e "
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json'));
          const id=a.expo.extra?.eas?.projectId; if(!id) throw new Error('no projectId');
          a.expo.updates={...a.expo.updates,url:'https://u.expo.dev/'+id};
          fs.writeFileSync('app.json',JSON.stringify(a,null,2)+'\n');"
          git diff --stat
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app.json eas.json 2>/dev/null || git add app.json
          git commit -m "Configure EAS Update" || echo "nothing to commit"
          git push
