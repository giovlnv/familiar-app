name: Publish over-the-air update

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/**']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until set up
        id: ready
        run: node -e "process.exit(require('./app.json').expo.updates?.url ? 0 : 1)" && echo ok=1 >> "$GITHUB_OUTPUT" || echo ok=0 >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.ok == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ok == '1'
        run: npm ci
      - if: steps.ready.outputs.ok == '1'
        env:
          MSG: ${{ github.event.head_commit.message || 'manual update' }}
        run: npx eas-cli@latest update --channel production --platform ios --non-interactive --message "$(echo "$MSG" | head -1)"
